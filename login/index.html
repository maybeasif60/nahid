<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Inter',sans-serif;
}

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:#050816;
overflow:hidden;
position:relative;
}

.bg{
position:absolute;
width:500px;
height:500px;
background:#2563eb;
border-radius:50%;
filter:blur(180px);
opacity:.25;
top:-100px;
left:-100px;
}

.bg2{
position:absolute;
width:500px;
height:500px;
background:#7c3aed;
border-radius:50%;
filter:blur(180px);
opacity:.25;
bottom:-100px;
right:-100px;
}

.login-box{
width:420px;
padding:40px;
background:rgba(255,255,255,.05);
backdrop-filter:blur(20px);
border:1px solid rgba(255,255,255,.08);
border-radius:30px;
z-index:2;
}

.logo{
width:80px;
height:80px;
margin:auto;
border-radius:20px;
display:flex;
align-items:center;
justify-content:center;
font-size:34px;
font-weight:700;
background:linear-gradient(135deg,#2563eb,#7c3aed);
color:white;
margin-bottom:20px;
}

h1{
color:white;
text-align:center;
margin-bottom:8px;
}

.subtitle{
text-align:center;
color:#94a3b8;
margin-bottom:30px;
}

.input-group{
margin-bottom:15px;
}

input{
width:100%;
padding:16px;
background:rgba(255,255,255,.05);
border:1px solid rgba(255,255,255,.08);
border-radius:14px;
outline:none;
color:white;
}

input::placeholder{
color:#94a3b8;
}

button{
width:100%;
padding:16px;
border:none;
border-radius:14px;
cursor:pointer;
font-size:16px;
font-weight:600;
background:linear-gradient(135deg,#2563eb,#7c3aed);
color:white;
margin-top:10px;
}

button:hover{
opacity:.95;
}

.error{
margin-top:15px;
text-align:center;
color:#ef4444;
font-size:14px;
}

.success{
margin-top:15px;
text-align:center;
color:#22c55e;
font-size:14px;
}

.footer{
margin-top:20px;
text-align:center;
font-size:13px;
color:#64748b;
}
</style>
</head>
<body>

<div class="bg"></div>
<div class="bg2"></div>

<div class="login-box">

<div class="logo">A</div>

<h1>Admin Log In </h1>
<p class="subtitle">Secure Dashboard Login</p>

<form id="loginForm">

<div class="input-group">
<input
type="email"
id="email"
placeholder="Admin Email"
required>
</div>

<div class="input-group">
<input
type="password"
id="password"
placeholder="Password"
required>
</div>

<button type="submit">
Sign In
</button>

<div id="message"></div>

</form>

<div class="footer">
© 2026 Asif Admin Panel
</div>

</div>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";

import {
getAuth,
signInWithEmailAndPassword,
onAuthStateChanged
}
from "https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";

/* ==========
   FIREBASE CONFIG
   ========== */

const firebaseConfig = {
  apiKey: "AIzaSyAFKdP00t5xf2V0WZmdYsE06razKxdhCJg",
  authDomain: "nahid-822a1.firebaseapp.com",
  projectId: "nahid-822a1",
  storageBucket: "nahid-822a1.firebasestorage.app",
  messagingSenderId: "371819940238",
  appId: "1:371819940238:web:87cd1c49819eefd62dfcdf",
  measurementId: "G-N1KLTDNTBZ"
};

/* ==========
   INIT
   ========== */

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

const msg = document.getElementById("message");

/* ==========
   AUTO LOGIN CHECK
   ========== */

onAuthStateChanged(auth,(user)=>{

if(user){

window.location.href="../";

}

});

/* ==========
   LOGIN
   ========== */

document
.getElementById("loginForm")
.addEventListener("submit",async(e)=>{

e.preventDefault();

const email =
document.getElementById("email").value;

const password =
document.getElementById("password").value;

msg.innerHTML = "";

try{

await signInWithEmailAndPassword(
auth,
email,
password
);

msg.innerHTML =
'<div class="success">Login Successful...</div>';

setTimeout(()=>{

window.location.href =
"../";

},1000);

}catch(error){

msg.innerHTML =
`<div class="error">${error.message}</div>`;

}

});

</script>

</body>
</html>
